[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computor-agent"
version = "0.1.0"
description = "AI agents for the Computor course management system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  { name = "Maximilian Mandlez", email = "maximilian.mandlez@tugraz.at" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "computor-client @ git+https://github.com/computor-org/computor-backend.git@main#subdirectory=computor-client",
    "computor-types @ git+https://github.com/computor-org/computor-backend.git@main#subdirectory=computor-types",
    "watchdog>=3.0,<5.0",
    "websockets>=12.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
report = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "seaborn>=0.13",
    "pandas>=2.0",
]
api = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
computor-agent = "computor_agent.cli.main:cli"

[project.urls]
Homepage = "https://github.com/computor/computor-agent"
Repository = "https://github.com/computor/computor-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"computor_agent.api" = ["templates/*.html"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
