# Computor Agent Configuration
#
# Copy to config.yaml and edit:
#   cp config.example.yaml config.yaml

# Backend API (required)
backend:
  url: https://api.computor.example.com

  # Authentication: an API token, sent as the X-API-Token header.
  # The backend has no username/password login.
  api_token: ctp_your_api_token_here

# LLM provider (required)
llm:
  provider: ollama
  model: devstral-small
  base_url: http://localhost:11434/v1
  # For Docker: use http://host.docker.internal:11434/v1
  # Temperature is set per call (tutor.strategies[*].temperature,
  # tutor.figure_review.temperature), not here.

# Secondary vision-capable LLM, used only for figure review (optional).
# Required when tutor.figure_review.enabled is true unless
# tutor.figure_review.use_agent_llm is set.
# vision_llm:
#   provider: ollama
#   model: llava:13b
#   base_url: http://localhost:11434/v1

# Tutor configuration (optional)
#
# Activation: the agent responds to messages that @mention it. Its identity is
# the user it authenticates as (see `backend` above) — the backend resolves the
# mention server-side (mentions_me), so there is no name/tag to configure here.
tutor:
  personality:
    name: Tutor AI
    tone: friendly_professional

  # Review figures (plots/images) in submissions with a vision LLM
  figure_review:
    enabled: false
    # use_agent_llm: true   # reuse the main llm (must be vision-capable)
    # max_figures: 10
    # max_image_bytes: 5242880
    # image_extensions: [".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp"]

# Scheduler settings (top-level, optional)
scheduler:
  # Worker count: how many messages are processed concurrently (1-50).
  # Overridable per deployment via COMPUTOR_WORKERS / ./start.sh --workers N.
  max_concurrent_processing: 5
  # Interval of the periodic REST catch-up scan backing the WebSocket (seconds)
  poll_interval_seconds: 60
  # Minimum seconds between processing the same submission group
  cooldown_seconds: 5

# Environment overrides
# ---------------------
# Any value below is the base; a set (non-empty) COMPUTOR_* environment variable
# wins over the file (useful for Docker / launchd secrets). Each override is
# re-validated through the same schema as file values.
#
#   COMPUTOR_BACKEND_URL          -> backend.url
#   COMPUTOR_BACKEND_API_TOKEN    -> backend.api_token
#   COMPUTOR_LLM_PROVIDER         -> llm.provider
#   COMPUTOR_LLM_MODEL            -> llm.model
#   COMPUTOR_LLM_BASE_URL         -> llm.base_url
#   COMPUTOR_LLM_API_KEY          -> llm.api_key
#   COMPUTOR_VISION_LLM_PROVIDER  -> vision_llm.provider
#   COMPUTOR_VISION_LLM_MODEL     -> vision_llm.model
#   COMPUTOR_VISION_LLM_BASE_URL  -> vision_llm.base_url
#   COMPUTOR_VISION_LLM_API_KEY   -> vision_llm.api_key
#   COMPUTOR_WORKERS              -> scheduler.max_concurrent_processing (1-50)
