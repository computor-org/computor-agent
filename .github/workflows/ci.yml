name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          # The deployed tutors run 3.12; the runner default (3.14) has no
          # wheel for the locked pydantic-core.
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      # Enforce correctness-class lint without making the release gate depend
      # on cleaning the repository's pre-existing style backlog in one PR.
      - run: uv run ruff check . --select E9,F63,F7,F82
      - run: uv run pytest
