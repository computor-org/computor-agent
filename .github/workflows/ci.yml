name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # Enforce correctness-class lint without making the release gate depend
      # on cleaning the repository's pre-existing style backlog in one PR.
      - run: uv run ruff check . --select E9,F63,F7,F82
      - run: uv run pytest
